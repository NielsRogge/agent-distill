# Qwen3.5-4B served with thinking ON and vLLM's `qwen3` reasoning parser: the student's reasoning arrives as the
# response's reasoning field, never in the visible content, so answers carry no `</think>` and the leak guard
# (agent_distill.reasoning) stays quiet. Pi stores it as a thinking block and sends it back on later turns (same
# model), and Qwen3.5's chat template renders it in every assistant turn after the user's question: the student's own
# reasoning stays in its history, as in the CoT-proxy paper's inference setting (arXiv 2611.33148, Table 11).
#
# Use it for the base model with thinking on and for students trained with the cross-format recipe
# (`--think-target empty`: an empty think block in every training target, thinking on at inference). Not for the
# action-only students of `qwen3.5-4b-nothink`, whose training targets supervise the empty think block itself.
#
# 8,192 output tokens per turn (the paper's cap; the 1,024 default would cut most reasoning off). Qwen3.5-4B ships no
# generation_config.json, so vLLM would sample at temperature 1.0 with no top-k; the profile sets the paper's decoding
# (temperature 0.6, top-p 0.95, top-k 20, Qwen's own recommendation for precise thinking tasks) server-wide. The probe
# and GRPO pass their own sampling temperature; this override comes after theirs on the vLLM command line, so set a
# separate profile for those stages rather than reusing this one.
name = "qwen3.5-4b-think"
model = "Qwen/Qwen3.5-4B"

[serve]
reasoning_parser = "qwen3"
max_output_tokens = 8192
vllm_extra_args = "--override-generation-config '{\"temperature\": 0.6, \"top_p\": 0.95, \"top_k\": 20}'"

[sft]
# The default SFT stack plus flash-linear-attention: without it transformers runs Qwen3.5's gated delta rule in plain
# torch (the phase-1 SFT logged "The fast path is not available"), which dominates the 8-pass KL-replay recipe's time.
# The convolution stays on its torch fallback (causal-conv1d needs a CUDA build).
deps = ["accelerate==1.14.0", "bitsandbytes>=0.49.0", "datasets>=4.0.0", "peft==0.20.0", "torch>=2.7.0",
        "transformers==5.14.1", "trl==1.9.2", "flash-linear-attention==0.6.0"]
