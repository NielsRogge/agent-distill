name: Browser tests

# The `browser` extra's tests (preview, the judge's observer, the page sandbox) need Chromium; the main CI job
# skips them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra browser --extra hub
      - run: uv run playwright install --with-deps chromium
      - name: Point the tests at Playwright's Chromium
        run: |
          echo "AGENT_DISTILL_CHROMIUM=$(uv run python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Browser tests (none may skip)
        run: |
          uv run pytest -q tests/test_html_pages.py -rs | tee pytest.log
          ! grep -q SKIPPED pytest.log
