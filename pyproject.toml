[project]
name = "agent-distill"
version = "0.0.1"
description = "Distill frontier agents running in real agent harnesses (OpenCode, Pi) into small fine-tuned open models with TRL, OpenEnv and Hugging Face Jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
distill = "agent_distill.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_distill"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]  # docs keep hand-aligned code examples

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
