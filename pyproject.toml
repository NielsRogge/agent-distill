[project]
name = "agent-distill"
version = "0.0.1"
description = "Distill frontier agents running in real agent harnesses (OpenCode, Pi) into small fine-tuned open models with TRL, OpenEnv and Hugging Face Jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "huggingface-hub>=1.13.0",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
hub = ["datasets>=4.0.0"]  # label datasets for rescoring
browser = ["playwright==1.65.2", "pillow>=11"]  # the `preview` tool and page gates (examples/html-pages)
space = ["starlette>=0.40", "uvicorn>=0.30", "tokenizers>=0.21"]  # spaces/race: the race page (with `hub`)

[project.scripts]
distill = "agent_distill.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_distill"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]  # docs keep hand-aligned code examples

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
