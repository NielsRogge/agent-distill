# End-to-end smoke run of the recipe on a handful of rows (DESIGN.md §14, M3): GLM-5.3 traces in OpenCode 2.3.2,
# SFT of Qwen3.5-4B for 2 steps, merge, a tiny difficulty probe, 2 GRPO steps (+ merge), and evaluation of base, SFT,
# GRPO and teacher on 5 rows.
#
#   distill run examples/paper-urls/run-smoke.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b"
harness = "opencode@2.3.2"
name = "qwen35-4b-paper-urls-glm53-opencode-232-smoke"
stages = ["traces", "sft", "merge", "probe", "grpo", "eval"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"

[traces]
limit = 8
shards = 1
attempts = 1

[sft]
args = ["--max-steps", "2", "--save-steps", "1"]
timeout = "1h"

[probe]
sample = 4
k = 2
shards = 1
timeout = "1h"

[grpo]
args = ["--max-steps", "2", "--save-steps", "1", "--num-generations", "2", "--max-concurrent-rollouts", "4"]
timeout = "2h"
use_probe = false  # 4 probed rows may qualify none; the smoke run trains on the 8 traced rows' split instead

[eval]
splits = ["test"]
limit = 5
concurrency = 5
variants = ["base", "sft", "grpo", "teacher"]

[budget]
traces_usd = 2
gpu_usd = 60
