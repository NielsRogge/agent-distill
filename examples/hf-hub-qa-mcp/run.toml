# hf-hub-qa-mcp, phase 1 (SFT): GLM-5.3 traces in Pi 1.6.0 with only the HF MCP server's tools -> SFT of
# Qwen3.5-4B -> merge -> evaluation of base, SFT and teacher on the held-out test split. A trace is accepted when it
# answered, used only the allowed MCP tools, used the Hub, and stated the frozen gold value (rubrics.py).
# Phase 2 (probe -> GRPO) only with the user's go: --stages probe,grpo,grpo-merge and "grpo" in [eval] variants.
#
#   distill run examples/hf-hub-qa-mcp/run.toml --dry-run
#   distill smoke examples/hf-hub-qa-mcp/run.toml --set 'stages=["traces","sft","merge","eval"]' \
#       --set 'eval.variants=["base","sft","teacher"]' --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b"
harness = "pi@1.6.0"
name = "qwen35-4b-hf-hub-qa-mcp-glm-53-pi-160"
stages = ["traces", "sft", "merge", "eval"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"

[traces]
split = "train"
limit = 600  # of 1,070 train questions (shuffled, so every template is represented)
attempts = 2
shards = 3  # anonymous MCP rate limits: few episodes at once per job

[eval]
splits = ["test"]
limit = 150  # of 359 test questions
concurrency = 4  # anonymous MCP rate limits
timeout = 300
max_tool_calls = 15
variants = ["base", "sft", "teacher"]

[budget]
traces_usd = 150  # GLM-5.3 at ~$0.20 per episode (estimate; the pilot checks it)
judge_usd = 0  # no judge rubrics
gpu_usd = 60  # SFT, merge and the student evaluations
