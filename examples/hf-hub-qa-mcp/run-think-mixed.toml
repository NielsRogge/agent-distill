# Follow-up 4 (MCP twin): mixed factual + open-ended Recipe (a) SFT (`qwen3.5-4b-think`, KL replay) on the
# 3-tool HF MCP server. Combines the 599 MCP factoid traces with the accepted MCP open-ended traces from
# `run-think-open-ended-traces.toml` (filtered to <= 12 tool calls) and evaluates on all 377 test rows.
#
#   distill run examples/hf-hub-qa-mcp/run-think-mixed.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b-think"
harness = "pi@1.6.0"
name = "cursor-qwen35-4b-think-cfx-a-mixed-hf-hub-qa-mcp-v2-pi-160"
stages = ["sft", "eval"]

[repos]
traces = "nielsr/qwen35-4b-hf-hub-qa-mcp-v2-glm-53-pi-160-traces"  # 599 MCP factoid traces
replay = "nielsr/qwen35-4b-think-replay-openr1-oasst"

[hub]
namespace = "nielsr"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"
raw_logs = false

[sft]
args = [
  "--traces-repo", "nielsr/cursor-qwen35-4b-think-hf-hub-qa-mcp-open-ended-glm-53-pi-160-traces",
  "--max-tool-calls", "12",
]
timeout = "210m"

[eval]
splits = ["test"]
limit = 377
concurrency = 4
timeout = 300
max_tool_calls = 15
variants = ["sft"]

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 20
