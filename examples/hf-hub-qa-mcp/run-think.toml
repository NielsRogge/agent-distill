# hf-hub-qa-mcp, recommended route: a thinking student trained with the cross-format recipe of the CoT-proxy paper
# (arXiv 2611.33148, variant (a): empty think block in every SFT target, the teacher's prose around tool calls
# stripped, KL replay on the initial student's own out-of-domain generations; thinking on at inference). The
# `qwen3.5-4b-think` profile carries the recipe, so nothing here names it. 98.1% (370/377) on the test split, against
# 81.4% for the non-thinking SFT of run.toml and 96.0% after its GRPO phase (README: "Thinking student").
#
# The SFT reads run.toml's accepted GLM-5.3 traces (read only) and the shared Qwen3.5-4B replay pool; neither is
# regenerated. For new traces, add "traces" to `stages` and drop `[repos] traces`; for a new pool, add "replay"
# (before "sft") and drop `[repos] replay`.
#
#   distill run examples/hf-hub-qa-mcp/run-think.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b-think"
harness = "pi@1.6.0"
# The published results are run qwen35-4b-think-cfx-a-hf-hub-qa-mcp-v2-glm-53-pi-160 (experiments/cot-proxy/mcp-cfx-a.toml
# on branch claude/cot-proxy-experiments); this name keeps a re-run out of its repos.
name = "qwen35-4b-think-sft-hf-hub-qa-mcp-v2-glm-53-pi-160"
stages = ["sft", "eval"]

[repos]
traces = "agent-distillation-hf/qwen35-4b-hf-hub-qa-mcp-v2-glm-53-pi-160-traces"  # run.toml's accepted traces
replay = "agent-distillation-hf/qwen35-4b-think-replay-openr1-oasst"  # shared by every Qwen3.5-4B (thinking) run

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"
collection = "agent-distillation-hf/agent-distillation-6b09e6966000e7910fd46633"
raw_logs = false  # raw harness logs stay in the jobs (set while nielsr's private storage was full)

[sft]
timeout = "10h"  # 8 passes of the KL-replay loop took 1 h 27 min on one H200

[eval]
splits = ["test"]
limit = 377  # every v2 test question
concurrency = 4  # anonymous MCP rate limits
timeout = 300
max_tool_calls = 15
variants = ["sft"]  # base-think: models = { "base-think" = "Qwen/Qwen3.5-4B" }

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 60  # per stage: SFT <= 10 h on one H200
