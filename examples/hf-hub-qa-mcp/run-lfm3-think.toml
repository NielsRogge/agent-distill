# hf-hub-qa-mcp: LFM3-1.7B trained with the cross-format recipe (a) of the CoT-proxy paper (arXiv 2611.33148, variant without
# CoT-proxies): an empty, unsupervised think block before every SFT target, the teacher's prose around tool calls
# stripped, KL replay on LFM3-1.7B's own out-of-domain generations; thinking on at inference, with the anonymous HF MCP tools.
# The `lfm3-1.7b` profile carries the recipe and the LoRA targets; the adapter is served on the base model (vLLM 0.34
# serves LoRA on LFM3), so there is no merge stage. Results: ../hf-hub-qa-mcp/README.md (LFM3-1.7B recipe (a) section).
#
# The SFT reads run.toml's accepted GLM-5.3 traces (read only), the same 600 the Qwen3.5-4B recipe-(a) run used, and
# the shared LFM3-1.7B replay pool. The pool was built once, by this example's MCP twin with `--stages replay`:
#
#   distill run examples/hf-hub-qa-mcp/run-lfm3-think.toml --stages replay   # once, for both tasks
#   distill run examples/hf-hub-qa-mcp/run-lfm3-think.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "lfm3-1.7b"
harness = "pi@1.6.0"
name = "lfm3-17b-think-sft-hf-hub-qa-mcp-v2-glm-53-pi-160"
stages = ["sft", "eval"]

[repos]
traces = "agent-distillation-hf/qwen35-4b-hf-hub-qa-mcp-v2-glm-53-pi-160-traces"  # run.toml's accepted traces
replay = "agent-distillation-hf/lfm3-17b-replay-openr1-oasst"  # shared by every LFM3-1.7B (thinking) run

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"
collection = "agent-distillation-hf/agent-distillation-6b09e6966000e7910fd46633"
raw_logs = false  # raw harness logs stay in the jobs

[eval]
splits = ["test"]
limit = 377  # every v2 test question, as the base LFM3-1.7B runs (run-lfm3.toml)
concurrency = 4  # anonymous MCP rate limits
timeout = 300
max_tool_calls = 15
variants = ["base", "sft"]  # the adapter on the pinned base, and the base again on the same MCP server version
# The HF MCP server moved to 0.5.1 on 2026-11-27 (the snapshot is 0.4.39; the base LFM3 and Inkling runs saw 0.5.0
# with the same tool list; the Qwen runs saw 0.4.39). The only tool-list change is one more error code in hf_fs's
# outputSchema, which the model never sees (tools are declared from their inputSchema). 0.5.1 also rejects numbers
# inside hf_fs `args` arrays, which 0.5.0 accepted (34 of 1,511 hf_fs calls, in 14 of the 377 base LFM3 episodes), so
# the base is evaluated again here, next to the adapter. Records keep both tool digests and the live server version.
allow_mcp_drift = true

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 10  # per stage, worst case: SFT 10 h or the replay pool 2 h on one L4 ($0.80/h), eval 3 h
