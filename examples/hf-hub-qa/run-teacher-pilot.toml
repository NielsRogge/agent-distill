# Teacher pilot: GLM-5.3 answers the 51 seed questions in Pi 1.6.0 with the pinned hf CLI and skill, scored by the
# task's rubrics. GLM-5.3 -> Qwen3.5-4B is the pair for this task and its hf-mcp sibling (the user's choice). It checks the task and its verifiers against human judgement before any traces are bought.
#
#   distill run examples/hf-hub-qa/run-teacher-pilot.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b"  # unused by this run (teacher only); the student of later runs
harness = "pi@1.6.0"
name = "hf-hub-qa-pilot-glm-53-pi-160"  # the first pilot ran Kimi-K3.1-Pro (-kimi-k31-pro-pi-160)
stages = ["eval"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"

[eval]
splits = ["seed"]
limit = 51  # every seed question
concurrency = 4  # anonymous Hub API rate limits
timeout = 600
max_tool_calls = 20
variants = ["teacher"]

[budget]
traces_usd = 25  # teacher spend cap (the job stops starting episodes at this)
judge_usd = 5
