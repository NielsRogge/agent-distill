# hf-hub-qa (CLI), GRPO round 2 (user-approved 2026-11-26, within phase 2's $90 GPU cap; ~$43 spent before it).
#
# Round 1 (run-grpo.toml) trained on only 157 probe-qualified rows: GRPO gained efficiency but just +2.7 points.
# Round 2 continues from round 1's GRPO merge:
# - probe the round-1 GRPO model on all 1,162 train rows (k = 4), so the pool reflects the current policy;
# - GRPO from the round-1 merge on the rows it solves on 1-3 of 4 attempts;
# - evaluate the round-2 model on all 377 test questions (base, SFT and teacher numbers come from run-grpo.toml).
#
# [repos] sft-merged points at round 1's GRPO merge: the probe serves it, GRPO starts from it, and the round-2
# adapter is merged onto it.
#
#   distill run examples/hf-hub-qa/run-grpo2.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b-nothink"
harness = "pi@1.6.0"
name = "qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-grpo2"
stages = ["probe", "grpo", "eval"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"
raw_logs = false  # nielsr's private storage is nearly full: raw harness logs stay in the jobs

[repos]
traces = "nielsr/qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-traces"  # phase 1's traces (GRPO reads its chat format)
sft-merged = "nielsr/qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-grpo-grpo-merged"  # round 1's SFT + GRPO merge

[eval]
splits = ["test"]
limit = 377
concurrency = 4  # anonymous Hub API rate limits
timeout = 300
max_tool_calls = 15
variants = ["grpo"]  # round 2 only; "sft" here would re-evaluate round 1

[probe]
split = "train"
sample = 1162  # every train row
k = 4
shards = 6
timeout = "75m"  # round 1: 175 rows per shard in 33 min; 194 here on a faster policy (expected ~$15 in all)

[grpo]
args = ["--max-concurrent-rollouts", "16", "--save-steps", "10"]  # --max-steps is set from the probe's pool
timeout = "120m"  # round 1's 78 steps took 38 min on 2x H200
use_probe = true

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 47  # what is left of the user's $90 for phase 2
