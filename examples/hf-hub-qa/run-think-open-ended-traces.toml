# Collect accepted GLM-5.3 traces on the 240 open-ended Hub training questions (`open_ended.py`,
# `nielsr/hf-hub-questions-train`), strictly disjoint from the 51 judged eval questions (`judged.py`).
# Combined with the 600 factoid traces in `run-think-mixed.toml` to teach open-ended Hub search & synthesis
# alongside factual lookup.
#
#   distill run examples/hf-hub-qa/run-think-open-ended-traces.toml --dry-run
task = "open_ended.py"
teacher = "glm-5.3"
student = "qwen3.5-4b-think"
harness = "pi@1.6.0"
name = "cursor-qwen35-4b-think-hf-hub-qa-open-ended-glm-53-pi-160"
stages = ["traces"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"
raw_logs = false

[traces]
split = "train"
limit = 240
attempts = 2
shards = 4  # 60 questions per shard; keeps Hub API concurrency gentle

[budget]
traces_usd = 35  # ~280-300 episodes at ~$0.05/ep (~$15 expected; $8.75/shard cap)
judge_usd = 8    # ~280-300 Gemini 4 Hydrogen calls (~$2 expected; $2/shard cap)
gpu_usd = 0
