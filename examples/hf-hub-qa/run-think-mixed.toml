# hf-hub-qa (CLI), Option #3: mixed factual + open-ended SFT with Recipe (a) of the CoT-proxy paper
# (`qwen3.5-4b-think`: empty think target, stripped visible text around tool calls, KL replay; thinking on at
# inference). Combines run.toml's 600 factoid traces with the accepted GLM-5.3 traces from
# `run-think-open-ended-traces.toml` (240 disjoint open-ended questions), filtered to <= 12 tool calls so the
# student learns concise search habits without overfitting to single-factoid lookup.
#
# Evaluated on all 377 test questions of `agent-distillation-hf/hf-hub-facts-v2` (paired with full-test runs on 377 rows and
# with Recipe (a)-600 on test[:150]); evaluated on all 51 judged questions in `run-think-mixed-judged.toml`.
#
#   distill run examples/hf-hub-qa/run-think-mixed.toml --dry-run
task = "."
teacher = "glm-5.3"
student = "qwen3.5-4b-think"
harness = "pi@1.6.0"
name = "cursor-qwen35-4b-think-cfx-a-mixed-hf-hub-qa-v2-glm-53-pi-160"
stages = ["sft", "eval"]

[repos]
traces = "agent-distillation-hf/qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-traces"  # run.toml's 600 accepted factoid traces
replay = "agent-distillation-hf/qwen35-4b-think-replay-openr1-oasst"  # shared by every Qwen3.5-4B (thinking) run

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "agent-distillation-hf/hub-qa-qwen35-6b0a9ec11b5ead9f4c863b08"  # Hub QA · Qwen3.5 (family)
raw_logs = false

[sft]
args = [
  "--traces-repo", "agent-distillation-hf/cursor-qwen35-4b-think-hf-hub-qa-open-ended-glm-53-pi-160-traces",
  "--max-tool-calls", "12",
]
timeout = "210m"  # 8 passes over ~800 mixed traces: ~2 h on one H200

[eval]
splits = ["test"]
limit = 377  # all v2 test questions
concurrency = 4  # anonymous Hub API rate limits
timeout = 300
max_tool_calls = 15
variants = ["sft"]

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 20  # per stage, worst case on one H200; expected ~$10 SFT + ~$7 eval
