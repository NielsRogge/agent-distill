# Same settings as `run-lfm3-think-judged.toml` and `run-inkling-judged.toml` (600 s, 20 tool calls, 4 concurrent).
#
#   distill run examples/hf-hub-qa/run-lfm3-think-mixed-inkling-judged.toml --dry-run
task = "judged.py"
teacher = "inkling-2-mini-8k"
student = "lfm3-1.7b"
harness = "pi@1.6.0"
name = "cursor-lfm3-17b-think-cfx-a-mixed-inkling-hf-hub-qa-judged-pi-160"
stages = ["eval"]
profiles = ["../inkling-2-mini"]

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "agent-distillation-hf/hub-qa-lfm3-6b0a9eca04b0c6fbf2d136bd"  # Hub QA · LFM3 (family)
raw_logs = false

[eval]
splits = ["seed"]
limit = 51
concurrency = 4
timeout = 600
max_tool_calls = 20

[eval.models]
