# Judged pilot: GLM-5.3 answers the 51 judged questions (judged.py) in Pi 1.6.0 with the pinned hf CLI and skill, scored by the
# task's rubrics. GLM-5.3 -> Qwen3.5-4B is the pair for this task and its hf-mcp sibling (the user's choice).
# It checks the task and its verifiers against human judgement before any traces are bought.
#
#   distill run examples/hf-hub-qa/run-judged-pilot.toml --dry-run
task = "judged.py"
teacher = "glm-5.3"
student = "qwen3.5-4b-nothink"  # unused by this run (teacher only); the student of later runs
harness = "pi@1.6.0"
name = "hf-hub-qa-pilot-glm-53-pi-160"  # the first pilot ran Kimi-K3.1-Pro (-kimi-k31-pro-pi-160)
stages = ["eval"]

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"
collection = "agent-distillation-hf/agent-distillation-6b09e6966000e7910fd46633"

[eval]
splits = ["seed"]
limit = 51  # every seed question
concurrency = 4  # anonymous Hub API rate limits
timeout = 600
max_tool_calls = 20
variants = ["teacher"]

[budget]
traces_usd = 25  # teacher spend cap (the job stops starting episodes at this)
judge_usd = 5
