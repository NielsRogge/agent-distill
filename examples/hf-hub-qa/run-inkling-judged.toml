# Base Inkling-2-Mini (thinking on, 8,192 output tokens per reply via the inkling-2-mini-8k project profile) on the
# 51 open-ended Hugging Face Hub questions (`judged.py`), scored by live Hub references and the Gemini judge. The same
# settings as run-think-fullcot-judged.toml (600 s, 20 tool calls, 4 concurrent episodes). Results: README.
#
#   distill run examples/hf-hub-qa/run-inkling-judged.toml --dry-run
task = "judged.py"
teacher = "glm-5.3"  # names the run family; not evaluated here (the teacher's records are the pilot's)
student = "inkling-2-mini-8k"
harness = "pi@1.6.0"
name = "inkling-2-mini-8k-hf-hub-qa-judged-glm-53-pi-160"
stages = ["eval"]
profiles = ["../inkling-2-mini"]

[hub]
namespace = "agent-distillation-hf"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "agent-distillation-hf/hub-qa-inkling-2-mini-6b0a9ec95a43b05307ad5884"  # Hub QA · Inkling-2-Mini (family)
raw_logs = false

[eval]
splits = ["seed"]
limit = 51
concurrency = 4
timeout = 600
max_tool_calls = 20
variants = ["base"]

[budget]
traces_usd = 0
judge_usd = 5
gpu_usd = 10
