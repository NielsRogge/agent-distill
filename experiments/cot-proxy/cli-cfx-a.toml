# CoT-proxy experiments, step 3 on the CLI task: recipe (a), the MCP winner (98.1% vs 81.4%), on hf-hub-qa. The
# phase-1 GLM-5.3 CLI traces (read only) -> SFT of Qwen3.5-4B with an empty think block in every target, visible text
# stripped, KL replay on the shared out-of-domain pool, LoRA r16/alpha 32, lr 3e-5 constant after 2 warmup updates,
# 8 passes of 17 teacher + 3 replay samples per update -> evaluation with thinking on (qwen3.5-4b-think) on the first
# 150 test questions, the rows of the existing CLI evaluations (47.3% base, 78.0% SFT, 86.7% base-think).
#
#   distill run experiments/cot-proxy/cli-cfx-a.toml --dry-run
task = "../../examples/hf-hub-qa"
teacher = "glm-5.3"
student = "qwen3.5-4b-think"
harness = "pi@1.6.0"
name = "qwen35-4b-think-cfx-a-hf-hub-qa-v2-glm-53-pi-160"
stages = ["sft", "eval"]

[repos]
traces = "nielsr/qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-traces"  # phase 1's accepted traces, read only
replay = "nielsr/qwen35-4b-think-replay-openr1-oasst"  # shared by every Qwen3.5-4B (thinking) run

[hub]
namespace = "nielsr"
bill_to = "huggingface"
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"
raw_logs = false

[sft]
replay = true
timeout = "10h"
args = ["--think-target", "empty", "--strip-visible-text", "--full-trajectory", "--lora-rank", "16",
        "--lora-alpha", "32", "--lora-dropout", "0", "--learning-rate", "3e-5", "--warmup-steps", "2",
        "--epochs", "8", "--save-steps", "50"]

[eval]
splits = ["test"]
limit = 150
concurrency = 4
timeout = 300
max_tool_calls = 15
variants = ["sft"]

[budget]
traces_usd = 0
judge_usd = 0
gpu_usd = 55  # per stage: SFT <= 10 h on H200 (worst case $50; MCP took 1.5 h)
