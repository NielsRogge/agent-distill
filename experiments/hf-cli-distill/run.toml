# Cursor experiment (phase 1): Full-train curated thinking-SFT of Qwen3.5-4B from GLM-5.3 on hf-hub-qa (CLI).
#
# Improvements over phase 1 on main (117/150 = 78.0%):
# 1. Full training split: collects rows 600..1161 (562 new GLM-5.3 traces) and combines them with the
#    existing 600 traces (rows 0..599, read-only), nearly doubling the dataset (~1,160 traces total).
# 2. Clean trace curation: excludes accepted traces where GLM-5.3 triggered CLI errors (`hf_errors=0`)
#    or exceeded 12 tool calls so the 4B student never imitates invalid flags like `--tree --format json`.
# 3. Direct reasoning distillation (`keep_reasoning = true`) in Qwen3.5's native thinking mode with
#    `--reasoning-parser qwen3` and fixed tool schemas (no phantom `submit` tool).
# 4. 3 epochs with cosine LR (1.5e-4, 5% warmup, weight decay 0.01) and flash-linear-attention on H200.
task = "../../examples/hf-hub-qa"
teacher = "glm-5.3"
student = "qwen3.5-4b-think-sft"
harness = "pi@1.6.0"
name = "cursor-qwen35-4b-think-hf-hub-qa-v2-glm-53-pi-160"
profiles = ["profiles"]
stages = ["traces", "sft", "merge", "eval"]

[hub]
namespace = "nielsr"
bill_to = "huggingface"  # pragma: allowlist secret
collection = "nielsr/agent-distillation-6b0445568a39b1d979c52e31"
raw_logs = false

[traces]
split = "train"
start = 600
attempts = 2
shards = 4

[sft]
timeout = "4h"
args = [
  "--traces-repo", "nielsr/qwen35-4b-hf-hub-qa-v2-glm-53-pi-160-traces",
  "--max-metric", "hf_errors=0",
  "--max-tool-calls", "12",
  "--epochs", "3",
  "--learning-rate", "1.5e-4",
  "--lr-scheduler-type", "cosine",
  "--warmup-ratio", "0.05",
  "--weight-decay", "0.01",
  "--save-steps", "50",
]

[eval]
splits = ["validation", "test"]
limit = 150
concurrency = 4
timeout = 300
max_tool_calls = 15
variants = ["sft"]

[budget]
traces_usd = 45
judge_usd = 0
gpu_usd = 60
