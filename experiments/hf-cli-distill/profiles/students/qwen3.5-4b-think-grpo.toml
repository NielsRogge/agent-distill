# Qwen3.5-4B thinking profile for difficulty probing and on-policy GRPO:
# - Keeps vLLM's `qwen3` reasoning parser on with 4,096 output tokens per turn.
# - Omits `--override-generation-config` from `vllm_extra_args` so the probe (`--temperature 0.8`)
#   and GRPO trainer control sampling directly without colliding with server-wide overrides.
name = "qwen3.5-4b-think-grpo"
model = "Qwen/Qwen3.5-4B"

[serve]
reasoning_parser = "qwen3"
max_output_tokens = 4096

[probe]
timeout = "4h"
shards = 4
sample = 1162
k = 4
concurrency = 4
temperature = 0.8
episode_timeout = 240

[grpo]
flavor = "h200x2"
timeout = "6h"
args = [
  "--max-concurrent-rollouts", "12",
  "--max-completion-length", "4096",
  "--temperature", "0.8",
  "--learning-rate", "1e-5",
  "--warmup-steps", "5",
  "--num-generations", "8",
  "--gradient-accumulation-steps", "2",
  "--max-steps", "60",
  "--save-steps", "15",
]
