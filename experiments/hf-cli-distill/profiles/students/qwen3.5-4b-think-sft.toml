# Qwen3.5-4B with native thinking ON and direct reasoning distillation (`keep_reasoning = true`):
# - SFT supervises GLM-5.3's concise reasoning_content inside Qwen3.5's native <think>...</think>
#   blocks alongside tool calls and final answers, using flash-linear-attention for fast H200 training.
# - Serving enables vLLM's `qwen3` reasoning parser with 8,192 output tokens and Qwen3.5's recommended
#   thinking decoding (temperature 0.6, top-p 0.95, top-k 20) so reasoning stays in the reasoning field
#   and Pi replays it cleanly across turns.
name = "qwen3.5-4b-think-sft"
model = "Qwen/Qwen3.5-4B"

[serve]
reasoning_parser = "qwen3"
max_output_tokens = 8192
vllm_extra_args = "--override-generation-config '{\"temperature\": 0.6, \"top_p\": 0.95, \"top_k\": 20}'"

[sft]
keep_reasoning = true
deps = [
  "accelerate==1.14.0",
  "bitsandbytes>=0.49.0",
  "datasets>=4.0.0",
  "peft==0.20.0",
  "torch>=2.7.0",
  "transformers==5.14.1",
  "trl==1.9.2",
  "flash-linear-attention==0.6.0",
]
